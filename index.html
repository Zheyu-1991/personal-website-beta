<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>Zheyu x Codex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --paper: oklch(95.7% 0.017 85);
        --ink: oklch(20.5% 0.025 40);
        --accent: oklch(59% 0.13 36);
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 17% 18%, oklch(91% 0.042 85 / 0.72), transparent 26rem),
          radial-gradient(circle at 83% 81%, oklch(90% 0.05 47 / 0.52), transparent 32rem),
          var(--paper);
        color: var(--ink);
      }

      main {
        position: relative;
        width: min(90vw, 82rem);
        padding: clamp(1.5rem, 5vw, 5rem) 0;
      }

      main::before {
        content: "";
        position: absolute;
        z-index: -1;
        width: clamp(4.5rem, 10vw, 9rem);
        aspect-ratio: 1;
        right: clamp(0rem, 4vw, 4rem);
        top: clamp(-0.5rem, 2vw, 2rem);
        border-radius: 50%;
        background: var(--accent);
        transform: rotate(-15deg);
        animation: drift 5s cubic-bezier(.22, 1, .36, 1) infinite alternate;
      }

      h1 {
        margin: 0;
        max-width: 11ch;
        font-family: "DM Serif Display", Georgia, serif;
        font-size: clamp(4.25rem, 15vw, 13rem);
        font-weight: 400;
        line-height: 0.79;
        letter-spacing: -0.075em;
        text-wrap: balance;
        animation: arrive 950ms cubic-bezier(.22, 1, .36, 1) both;
      }

      .accent { color: var(--accent); font-style: italic; }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(0.14em); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes drift {
        from { transform: rotate(-15deg) translate(-0.3rem, 0.2rem); }
        to { transform: rotate(-7deg) translate(0.3rem, -0.25rem); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Zheyu <span class="accent">x</span> Codex</h1>
    </main>
  </body>
</html>
